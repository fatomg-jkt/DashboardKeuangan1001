<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Dashboard budgeting untuk monitoring budget dan aktual perusahaan" />
    <title>Dashboard Budget vs Aktual</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.js"></script>
    <script>
      const brandingObserver = new MutationObserver(() => {
        const branding = document.querySelector('.identity small');
        if (branding && branding.textContent !== '1001 & Maison Accounting') {
          branding.textContent = '1001 & Maison Accounting';
        }
      });

      brandingObserver.observe(document.getElementById('root'), {
        childList: true,
        subtree: true,
      });
    </script>
  </body>
</html>
